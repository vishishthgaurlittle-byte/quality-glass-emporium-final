<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Glass Emporium — Premium Artisan Frames & Glass</title>
  <meta name="description" content="Premium artisan glass frames and custom display solutions for your most cherished memories. Explore our collection of handcrafted designs." />
  <meta name="keywords" content="artisan glass, custom frames, display cases, photo framing, museum glass" />
  <meta name="author" content="Quality Glass Emporium" />
  <meta name="theme-color" content="#00162c" />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2300162c' width='32' height='32' rx='6'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- App Root -->
  <div id="app">
    <!-- Loading State -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px;">
      <div style="width: 40px; height: 40px; border: 3px solid var(--outline-variant); border-top-color: var(--secondary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="font-family: Manrope, sans-serif; font-size: 14px; color: var(--subtle-gray);">Loading Quality Glass Emporium...</p>
    </div>
  </div>
  
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- App Scripts (order matters: data → router → auth → pages → app) -->
  <script src="js/supabase-client.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  
  <!-- Page Modules -->
  <script src="js/pages/storefront-home.js"></script>
  <script src="js/pages/collections.js"></script>
  <script src="js/pages/product-detail.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/checkout.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/user-dashboard.js"></script>
  <script src="js/pages/admin-dashboard.js"></script>
  <script src="js/pages/admin-pages.js"></script>
  
  <!-- Main App (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
